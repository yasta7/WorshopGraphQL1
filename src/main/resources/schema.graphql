type Option {
    codeOption: Int!
    libelle: String!
    domaine: String!
    responsable: String!
    credits: Int!
    semestre: Int!
    capacite: Int!
}

type Etudiant {
    identifiant: String!
    nom: String!
    prenom: String!
    anneeEtude: Int!
    email: String
    option: Option
}

type Query {
    getAllOptions: [Option!]!
    getOptionsByDomaine(domaine: String!): [Option!]!
    getOptionByCode(codeOption: Int!): Option

    getAllEtudiants: [Etudiant!]!
    getEtudiantById(identifiant: String!): Etudiant
    getEtudiantsByOption(codeOption: Int!): [Etudiant!]!
}

type Mutation {
    addOption(codeOption: Int!, libelle: String!, domaine: String!, responsable: String!, credits: Int!, semestre: Int!, capacite: Int!): Boolean!
    updateOption(codeOption: Int!, libelle: String!, domaine: String!, responsable: String!, credits: Int!, semestre: Int!, capacite: Int!): Boolean!
    deleteOption(codeOption: Int!): Boolean!

    addEtudiant(identifiant: String!, nom: String!, prenom: String!, anneeEtude: Int!, email: String, codeOption: Int!): Boolean!
    updateEtudiant(identifiant: String!, nom: String!, prenom: String!, anneeEtude: Int!, email: String, codeOption: Int!): Boolean!
    deleteEtudiant(identifiant: String!): Boolean!
}

schema {
    query: Query
    mutation: Mutation
}